    <radialGradient id="glow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#DF5D2B" stop-opacity=".28"/><stop offset="1" stop-color="#DF5D2B" stop-opacity="0"/></radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#F17F53"/></marker>
  </defs>
  <rect width="840" height="560" fill="url(#bg)"/>
  <rect width="840" height="560" fill="url(#glow)"/>
  <circle cx="420" cy="280" r="170" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
  <g fill="none" stroke="#F17F53" stroke-width="2.5" marker-end="url(#ar)">
    <path d="M462 116 A170 170 0 0 1 580 232"/>
