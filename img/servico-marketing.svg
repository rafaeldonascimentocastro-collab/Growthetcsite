    <g transform="translate(590 280)"><circle r="40" fill="#fff"/><text y="7" font-size="20" font-weight="500" fill="#182933">02</text></g>
    <g transform="translate(420 450)"><circle r="40" fill="#fff"/><text y="7" font-size="20" font-weight="500" fill="#182933">03</text></g>
    <g transform="translate(250 280)"><circle r="40" fill="#fff"/><text y="7" font-size="20" font-weight="500" fill="#182933">04</text></g>
    <text x="420" y="50" font-size="22" fill="#E4EAEE">Criar</text>
